<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoppe Market Supplies</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

/* NAVBAR */
header {
  position: absolute;
  width: 100%;
  top: 0;
  left: 0;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  color: white;
  z-index: 2;
}

header h1 {
  font-size: 20px;
}

header nav a {
  margin-left: 15px;
  color: white;
  text-decoration: none;
}

/* HERO SECTION */
.hero {
  height: 100vh;
  background: url("hero.jpg") no-repeat center center/cover;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
}

/* DARK OVERLAY */
.hero::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
}

/* TEXT CONTENT */
.hero-content {
  position: relative;
  color: white;
  z-index: 1;
}

.hero-content h2 {
  font-size: 45px;
  margin-bottom: 10px;
}

.hero-content p {
  margin-bottom: 20px;
  font-size: 18px;
}

/* BUTTON */
.btn {
  background: #25D366;
  padding: 12px 25px;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-size: 16px;
}

/* WHATSAPP FLOAT */
.whatsapp {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  color: white;
  padding: 15px;
  border-radius: 50%;
  font-size: 20px;
  text-decoration: none;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header>
  <h1>Shoppe Market Supplies</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h2>Shoppe Market Supplies</h2>
    <p>Fresh Produce • Snacks • Drinks • Auto Supplies</p>

    <!-- CHANGE NUMBER HERE -->
    <a href="https://wa.me/18687890535" class="btn">
      Order Now
    </a>
  </div>
</section>

<!-- WHATSAPP FLOAT BUTTON -->
<a href="https://wa.me/18687890535" class="whatsapp">💬</a>

</body>
</html>
